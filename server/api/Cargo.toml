[package]
name = "hjv-api"
version = "0.1.0"
edition = "2021"
description = "HJViewer account API: Yonsei portal login, the per-account device list, behind nginx on a systemd socket"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "hjv-api"
path = "src/main.rs"

[[bin]]
name = "hjv-fake-sso"
path = "src/bin/hjv-fake-sso.rs"
required-features = ["fake-sso"]

[features]
# builds hjv-fake-sso, the stand-in for the Yonsei SSO that the E2E runs on 127.0.0.1
fake-sso = []

[dependencies]
base64 = "0.23"
crypto_box = { version = "0.9", features = ["seal", "std"] }
ed25519-dalek = "2"
form_urlencoded = "1"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "server-graceful", "tokio"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false }
zeroize = "1"

[dev-dependencies]
# tests/relay_loop.rs runs hjv-relay's own loop (relay/) against hjv-api, over TLS with a test CA
# that rcgen makes (relay/PROTOCOL.md §1: the relay speaks HTTPS only)
hjv-relay = { path = "../../relay" }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }

[workspace]
