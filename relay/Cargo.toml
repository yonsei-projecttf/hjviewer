[package]
name = "hjv-relay"
version = "1.6.0"
edition = "2021"
description = "Wake-on-LAN relay for HJViewer: runs on an always-on Linux machine in a PC's LAN (a Synology NAS) and sends magic packets on signed commands from the HJViewer server"
license = "AGPL-3.0-only"
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
getrandom = "0.2"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
webpki-roots = "1"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[workspace]
