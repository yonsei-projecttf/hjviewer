# The /api/ paths of HJViewer once the account API is on (design v2 §10-1; server/api/README.md).
# This file takes the place of the "location ^~ /api/" block at the end of
# nginx-hjviewer-locations.conf: it is installed as /etc/nginx/snippets/hjviewer-api.conf, and that
# block is replaced by the line
#     include snippets/hjviewer-api.conf;
# Putting the old block back takes hjv-api out of the path again (apps built with the login then
# show errors in the login dialog and the device tab).
#
# It needs two zones, which nginx takes only at the http level, so they go into a file of their
# own, /etc/nginx/conf.d/hjviewer-api-zones.conf (Ubuntu's nginx.conf reads conf.d/*.conf inside
# http {}); until they are there, "nginx -t" fails with "zero size shared memory zone":
#     # login requests per client address (deploy/nginx-hjviewer-api.conf)
#     limit_req_zone $binary_remote_addr zone=hjv_login:1m rate=10r/m;
#     limit_conn_zone $binary_remote_addr zone=hjv_login_conn:1m;
#
# Only the account paths reach hjv-api, over the Unix socket that systemd holds
# (deploy/systemd/hjviewer-api.socket). nginx answers two of the app's questions itself, so that the
# login dialog and the device tab show no error while hjv-api is stopped. Everything else under
# /api/ (heartbeats, device information, connection records, file transfer logs) is answered at
# once with a 404, the body unread, as before: those requests never reach hjv-api.
#
# hjv-api counts logins per client address from X-Real-IP, set below to $remote_addr. That holds
# only while $remote_addr is the real peer: the server and http blocks must have no
# real_ip_header or set_real_ip_from that lets a client choose it (check before installing).
#
# The exact (=) and ^~ locations win over the site's regular expressions, so /api/x.php never goes
# to PHP. The error pages make the server block's deny and limit_req answers JSON on the account
# paths; a location with an error_page of its own inherits none from the server block.

location ^~ /api/ {
    access_log off;
    default_type "application/json; charset=utf-8";

    # for the account locations below, which pass requests on to hjv-api
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # hjv-api counts failed logins per address and trusts this header, so it is always set here,
    # replacing whatever the client sent (never use $proxy_add_x_forwarded_for)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # the site's login cookies stay with the site
    proxy_set_header Cookie "";
    # stated, so that nothing comes from the server block
    proxy_intercept_errors off;
    proxy_request_buffering on;
    client_max_body_size 64k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    error_page 403 = @hjv_403;
    error_page 413 = @hjv_413;
    error_page 429 = @hjv_429;
    error_page 502 503 504 = @hjv_down;

    # A login is one request (two when the app retries the same body, or sends a second-factor
    # code). Per client address: ten a minute after a burst of five, four at a time; more get 429
    # at once, before hjv-api, which holds every failure for about two seconds. These replace any
    # limit_req or limit_conn of the server block on this path.
    location = /api/login {
        limit_req zone=hjv_login burst=5 nodelay;
        limit_req_status 429;
        limit_conn hjv_login_conn 4;
        limit_conn_status 429;
        proxy_pass http://unix:/run/hjviewer-api.sock:;
    }
    location = /api/currentUser { proxy_pass http://unix:/run/hjviewer-api.sock:; }
    location = /api/logout      { proxy_pass http://unix:/run/hjviewer-api.sock:; }
    location = /api/users       { proxy_pass http://unix:/run/hjviewer-api.sock:; }
    location = /api/peers       { proxy_pass http://unix:/run/hjviewer-api.sock:; }
    location ^~ /api/hjv/       { proxy_pass http://unix:/run/hjviewer-api.sock:; }
    # without it, /api/hjv would get nginx's HTML redirect to /api/hjv/
    location = /api/hjv         { return 404 '{"error":"not found"}'; }

    # answered here, also while hjv-api is stopped
    location = /api/login-options {
        return 200 '[]';
    }
    location = /api/device-group/accessible {
        return 200 '{"total":0,"data":[]}';
    }

    # the rest of /api/
    return 404 '{"error":"not found"}';
}

location @hjv_403 {
    default_type "application/json; charset=utf-8";
    return 403 '{"error":"접근이 차단되었습니다"}';
}
location @hjv_413 {
    default_type "application/json; charset=utf-8";
    return 413 '{"error":"요청이 너무 큽니다"}';
}
location @hjv_429 {
    default_type "application/json; charset=utf-8";
    return 429 '{"error":"잠시 뒤 다시 시도해 주세요"}';
}
location @hjv_down {
    default_type "application/json; charset=utf-8";
    return 503 '{"error":"HJViewer 서버를 지금 쓸 수 없습니다. 비밀번호 없는 연결은 PC가 받아 둔 목록으로 하루 동안 계속됩니다. 잠시 뒤 다시 시도해 주세요."}';
}
