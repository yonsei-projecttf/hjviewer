# For a server whose ports 80/443 already belong to a web server (nginx, Apache, ...): runs only
# hbbs and hbbr, with their WebSocket ports on 127.0.0.1 for that web server to proxy.
# docs/server-runbook.md has the nginx and Apache configuration.
#   docker compose -f docker-compose.behind-proxy.yml up -d --build

# container logs are capped here rather than in the global Docker daemon settings
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  hbbs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hjviewer-server:local
    command: ["hbbs", "-r", "${HJV_DOMAIN:?set HJV_DOMAIN in .env}"]
    ports:
      # only the local web server may reach it: hbbs trusts its X-Real-IP / X-Real-Port headers
      - "127.0.0.1:21118:21118"
    volumes:
      - ./data:/data
    logging: *logging
    restart: unless-stopped

  hbbr:
    image: hjviewer-server:local
    command: ["hbbr", "-k", "_"]
    ports:
      - "127.0.0.1:21119:21119"
    volumes:
      - ./data:/data
    depends_on:
      - hbbs
    logging: *logging
    restart: unless-stopped
