# Apache site for an HJViewer server on a host name of its own, in front of
# docker-compose.behind-proxy.yml (hbbs and hbbr on 127.0.0.1). docs/server-runbook.md installs it
# as /etc/apache2/sites-available/hjviewer.conf with the server's domain in place of DOMAIN; the
# VirtualHost addresses follow the server's other sites. Modules: ssl proxy proxy_http
# proxy_wstunnel headers alias.

<VirtualHost *:443>
    ServerName DOMAIN
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/DOMAIN/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/DOMAIN/privkey.pem

    # wss://DOMAIN/ws/id: hbbs (rendezvous), wss://DOMAIN/ws/relay: hbbr (relay). The tunnels use
    # the server's Timeout (300 s on Ubuntu); hbbs sends registered PCs a frame every 10 seconds.
    ProxyPass /ws/id    ws://127.0.0.1:21118
    ProxyPass /ws/relay ws://127.0.0.1:21119
    # hbbs tells clients apart by address and port, taken from these headers
    <Location "/ws/">
        RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
        RequestHeader set X-Real-Port "expr=%{REMOTE_PORT}"
    </Location>

    # Everything else, including the apps' https://DOMAIN/api/... calls (this server has no API),
    # gets a 404 at once, with the source notice the AGPL asks for
    Redirect 404 /
    ErrorDocument 404 "HJViewer server (GNU AGPL-3.0). Source: https://github.com/ysfaculty/hjviewer"
</VirtualHost>

<VirtualHost *:80>
    ServerName DOMAIN
    Redirect permanent / https://DOMAIN/
</VirtualHost>
