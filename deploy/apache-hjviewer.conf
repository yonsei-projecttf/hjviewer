# Apache site for an HJViewer server on a host name of its own, in front of
# docker-compose.behind-proxy.yml (hbbs and hbbr on 127.0.0.1). docs/server-runbook.md installs it
# as /etc/apache2/sites-available/hjviewer.conf with the server's domain in place of DOMAIN; the
# VirtualHost addresses follow the server's other sites. Modules: ssl proxy proxy_http
# proxy_wstunnel headers alias.

<VirtualHost *:443>
    ServerName DOMAIN
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/DOMAIN/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/DOMAIN/privkey.pem

    # wss://DOMAIN/ws/id: hbbs (rendezvous), wss://DOMAIN/ws/relay: hbbr (relay). The tunnels use
    # the server's Timeout (300 s on Ubuntu); hbbs sends registered PCs a frame every 10 seconds.
    ProxyPass /ws/id    ws://127.0.0.1:21118
    ProxyPass /ws/relay ws://127.0.0.1:21119
    # hbbs tells clients apart by address and port, taken from these headers. It trusts them, so
    # they are always set here, replacing whatever the client sent; ProxyAddHeaders would keep the
    # client's own X-Forwarded-For and append to it. hbbs/hbbr listen on 127.0.0.1 only.
    <Location "/ws/">
        ProxyAddHeaders Off
        RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
        RequestHeader set X-Real-Port "expr=%{REMOTE_PORT}"
        RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
    </Location>

    # The account API (hjv-api, server/api; design v3 5-8): the paths of
    # deploy/nginx-hjviewer-api.conf, over the Unix socket systemd holds for hjv-api
    # (deploy/systemd/hjviewer-api.socket, whose group must be the one Apache's workers run in).
    # hjv-api counts failed logins per client address from X-Real-IP, always set here. nginx also
    # limits logins and the NAS relays' registrations per address before hjv-api and answers two of
    # the paths itself; Apache leaves those to hjv-api.
    # The fixed names by a pattern, /api/hjv/ by its prefix: a pattern that hands a path the client
    # chose back as $1 is what Apache before 2.4.56 split requests with (CVE-2023-25690).
    ProxyPassMatch "^/api/(login|currentUser|logout|users|peers|login-options|device-group/accessible)$" "unix:/run/hjviewer-api.sock|http://localhost/api/$1"
    ProxyPass "/api/hjv/" "unix:/run/hjviewer-api.sock|http://localhost/api/hjv/"
    <LocationMatch "^/api/(login|currentUser|logout|users|peers|login-options|device-group/accessible|hjv/.*)$">
        ProxyAddHeaders Off
        RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
        RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
        # the site's login cookies stay with the site
        RequestHeader unset Cookie
        # hjv-api stopped: the app's banner says what this means for its users
        ErrorDocument 503 "{\"error\":\"HJViewer 서버를 지금 쓸 수 없습니다. 비밀번호 없는 연결은 PC가 받아 둔 목록으로 하루 동안 계속됩니다. 잠시 뒤 다시 시도해 주세요.\"}"
        Header always set Content-Type "application/json; charset=utf-8" "expr=%{REQUEST_STATUS} == 503"
    </LocationMatch>

    # Everything else, including the rest of the apps' https://DOMAIN/api/... calls (heartbeats,
    # device information, connection records), gets a 404 at once, with the source notice the AGPL
    # asks for
    Redirect 404 /
    ErrorDocument 404 "HJViewer server (GNU AGPL-3.0). Source: https://github.com/yonsei-projecttf/hjviewer"
</VirtualHost>

<VirtualHost *:80>
    ServerName DOMAIN
    Redirect permanent / https://DOMAIN/
</VirtualHost>
