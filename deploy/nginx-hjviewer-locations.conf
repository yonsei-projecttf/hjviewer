# The locations HJViewer needs in nginx, for the HTTPS server block of the server's domain: a site
# of its own (nginx-hjviewer.conf includes this file) or an existing site that shares the domain
# (one include line in that site's server block). docs/server-runbook.md installs it as
# /etc/nginx/snippets/hjviewer-locations.conf. The site's other paths stay as they are.

# wss://<domain>/ws/id: hbbs (rendezvous). Registered PCs keep this connection open; hbbs sends
# them a frame every 10 seconds, so the timeout is never reached while they are connected. The
# apps negotiate HTTP/1.1, so HTTP/2 on the same listener does not matter.
location = /ws/id {
    proxy_pass http://127.0.0.1:21118;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # hbbs tells clients apart by address and port, taken from these headers
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Real-Port $remote_port;
    proxy_read_timeout 120s;
}

# wss://<domain>/ws/relay: hbbr (relay)
location = /ws/relay {
    proxy_pass http://127.0.0.1:21119;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Real-Port $remote_port;
    proxy_read_timeout 120s;
}

# The apps call https://<domain>/api/... (a heartbeat every 15 seconds, device information every
# 2 minutes); there is no API, so answer at once rather than hand the requests to the site
location ^~ /api/ {
    access_log off;
    return 404;
}
