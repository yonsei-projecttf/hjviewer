# The locations HJViewer needs in nginx, for the HTTPS server block of the server's domain: a site
# of its own (nginx-hjviewer.conf includes this file) or an existing site that shares the domain
# (one include line in that site's server block). docs/server-runbook.md installs it as
# /etc/nginx/snippets/hjviewer-locations.conf. The site's other paths stay as they are.

# wss://<domain>/ws/id: hbbs (rendezvous). Registered PCs keep this connection open; hbbs sends
# them a frame every 10 seconds and they echo it, so the 120 s timeouts are never reached while
# they are connected (the client itself drops a silent connection and reconnects). The apps
# negotiate HTTP/1.1, so HTTP/2 on the same listener does not matter. An nginx reload leaves open
# connections on the old workers until they close, so sessions survive it.
location = /ws/id {
    proxy_pass http://127.0.0.1:21118;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # hbbs tells clients apart by address and port, taken from these headers. It trusts them, so
    # they are always set here, replacing whatever the client sent (never use
    # $proxy_add_x_forwarded_for, which keeps the client's own value); and hbbs/hbbr listen on
    # 127.0.0.1 only, so that nothing but this proxy can reach them.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Real-Port $remote_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# wss://<domain>/ws/relay: hbbr (relay)
location = /ws/relay {
    proxy_pass http://127.0.0.1:21119;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Real-Port $remote_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# https://<domain>/api/hjv/version: the signed version policy of the apps from 1.6.0 on, the file
# the operator installs as /etc/hjviewer/version-policy.json once deploy/hjv-update-verify.sh has
# checked it (docs/server-runbook.md 8). nginx hands it out itself, before a login and while
# hjv-api is stopped; an exact location wins over the /api/ block below and over the account
# API's (nginx-hjviewer-api.conf), so it stays when that block is replaced. Until the file is
# there the answer is 404, which the apps take for "no policy yet". No access log (every app asks
# every few hours) and no error log line for the missing file. nginx's ETag stays: the apps send
# no If-None-Match and take a 304 for a failed check. The 404 is answered here: a site's own
# "error_page 404" (to a WordPress page, say) would hand the request to the site and log it.
location = /api/hjv/version {
    alias /etc/hjviewer/version-policy.json;
    types { }
    default_type "application/json; charset=utf-8";
    access_log off;
    log_not_found off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    error_page 404 = @hjv_version_none;
}
location @hjv_version_none {
    access_log off;
    default_type "application/json; charset=utf-8";
    add_header Cache-Control "no-cache" always;
    return 404 '{"error":"no version policy"}';
}

# The apps call https://<domain>/api/... (a heartbeat every 15 seconds, device information every
# 2 minutes); there is no API, so answer at once rather than hand the requests to the site
location ^~ /api/ {
    access_log off;
    return 404;
}
