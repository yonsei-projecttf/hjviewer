# nginx site for an HJViewer server on a host name of its own, in front of
# docker-compose.behind-proxy.yml (hbbs and hbbr on 127.0.0.1). docs/server-runbook.md installs it
# as /etc/nginx/sites-available/hjviewer with the server's domain in place of DOMAIN; the listen
# lines follow the server's other sites (an IPv6 [::] line, a specific address).

server {
    listen 443 ssl;
    server_name DOMAIN;
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    # wss://DOMAIN/ws/id: hbbs (rendezvous). Registered PCs keep this connection open; hbbs sends
    # them a frame every 10 seconds, so the timeout is never reached while they are connected.
    location = /ws/id {
        proxy_pass http://127.0.0.1:21118;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # hbbs tells clients apart by address and port, taken from these headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_read_timeout 120s;
    }

    # wss://DOMAIN/ws/relay: hbbr (relay)
    location = /ws/relay {
        proxy_pass http://127.0.0.1:21119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_read_timeout 120s;
    }

    # The apps call https://DOMAIN/api/... (heartbeat, device info); this server has no API and
    # answers at once instead of passing the requests anywhere
    location ^~ /api/ {
        access_log off;
        return 404;
    }

    # AGPL: users of the server reach its source from here
    location / {
        default_type text/plain;
        return 200 "HJViewer server (GNU AGPL-3.0). Source: https://github.com/ysfaculty/hjviewer\n";
    }
}

server {
    listen 80;
    server_name DOMAIN;
    return 301 https://$host$request_uri;
}
