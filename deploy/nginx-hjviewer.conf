# nginx site for an HJViewer server on a host name of its own, in front of
# docker-compose.behind-proxy.yml (hbbs and hbbr on 127.0.0.1). docs/server-runbook.md installs it
# as /etc/nginx/sites-available/hjviewer with the server's domain in place of DOMAIN, next to
# nginx-hjviewer-locations.conf in /etc/nginx/snippets/; the listen lines follow the server's other
# sites (an IPv6 [::] line, a specific address).

server {
    listen 443 ssl;
    server_name DOMAIN;
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    # /ws/id, /ws/relay and /api/
    include snippets/hjviewer-locations.conf;

    # AGPL: users of the server reach its source from here
    location / {
        default_type text/plain;
        return 200 "HJViewer server (GNU AGPL-3.0). Source: https://github.com/yonsei-projecttf/hjviewer\n";
    }
}

server {
    listen 80;
    server_name DOMAIN;
    # in a location, so that certbot's ACME challenge location still takes precedence
    location / {
        return 301 https://$host$request_uri;
    }
}
