# The rate-limit zones of the account API's nginx locations (deploy/nginx-hjviewer-api.conf,
# installed as /etc/nginx/snippets/hjviewer-api.conf). nginx takes zones only at the http level:
# install this file as /etc/nginx/conf.d/hjviewer-api-zones.conf (Ubuntu's nginx.conf reads
# conf.d/*.conf inside http {}) before that snippet, which "nginx -t" refuses without it ("zero size
# shared memory zone"). It has the zones of both steps of design v3, the logins and the NAS
# relays' registrations, so that nginx changes once (design v3 5-8, 11 step 9). The names start
# with hjv_ to keep clear of the other sites on the same nginx.

# Registrations of NAS relays per source (location = /api/hjv/relay/hello, relay/PROTOCOL.md 4.3):
# an IPv4 address, or the /64 of an IPv6 address, which one network usually has to itself. The map
# keeps an IPv4 address's 4 bytes as they are and the first 8 of an IPv6 address's 16 bytes. An
# IPv4 client of a dual-stack listener ("listen [::]:443 ipv6only=off;") arrives as the
# IPv4-mapped IPv6 address ::ffff:a.b.c.d, whose first 8 bytes are zero for every IPv4 client:
# the first rule takes its last 4 bytes instead, the same key as on an IPv4 listener.
map $binary_remote_addr $hjv_relay_source {
    "~(?s)^\x00{10}\xff\xff(?<hjv_relay_v4>.{4})$" $hjv_relay_v4;
    "~(?s)^(?<hjv_relay_net>.{8}).{8}$" $hjv_relay_net;
    default $binary_remote_addr;
}
limit_req_zone $hjv_relay_source zone=hjv_relay_hello:1m rate=10r/m;

# Logins per source (location = /api/login), as the relay registrations above: an IPv4 address or
# an IPv6 /64, which hjv-api counts its failures per too. Keyed per IPv6 address, a client that
# takes a new address of its /64 for each try never met these limits. The map keeps the name of
# its first zone: nginx refuses a reload that gives a zone another key ("uses the ... key while
# previously it used the ... key", after nginx -t passed, the old settings left running), so these
# zones have new names where the key changed (from 1.9.3; before, hjv_login and hjv_login_conn
# per address).
limit_req_zone $hjv_relay_source zone=hjv_login_net:1m rate=10r/m;
limit_conn_zone $hjv_relay_source zone=hjv_login_net_conn:1m;

# The access password's tries per source (location = /api/hjv/guest, docs/access-tickets.md 3-5),
# apart from the logins: the staff-only gate of 1.8.0 adds them, and nginx -t refuses the new
# snippet without them. New names for the new key as for the logins (before 1.9.3, hjv_guest and
# hjv_guest_conn per address).
limit_req_zone $hjv_relay_source zone=hjv_guest_net:1m rate=10r/m;
limit_conn_zone $hjv_relay_source zone=hjv_guest_net_conn:1m;
