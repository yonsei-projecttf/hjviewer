# Retention of the journal namespace "hjviewer" (design v3 §5-8, §5-9): the lines of hjv-api
# (hjviewer-api.service) and of its check, backup and alert units, which all log there
# (LogNamespace=hjviewer); read them with journalctl --namespace=hjviewer. They hold counts,
# results and tags, never IDs, addresses or secrets (server/api/README.md).
#
# Installed as /etc/systemd/journald@hjviewer.conf. systemd-journald@hjviewer.service reads it when
# the namespace starts, which the first unit that logs there does; after a change:
#   sudo systemctl restart systemd-journald@hjviewer.service
#
# 30 days, by day: a journal file holds one day at most and goes once its newest line is 30 days
# old (docs/privacy.md). The size bound only matters if something floods the journal.

[Journal]
Storage=persistent
MaxRetentionSec=30day
MaxFileSec=1day
SystemMaxUse=256M
