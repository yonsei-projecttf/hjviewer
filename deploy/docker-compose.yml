# hjviewer server: Caddy terminates TLS on 443 and proxies WebSocket to hbbs (rendezvous) and
# hbbr (relay). Only 80/443 are published. docs/server-runbook.md is the full procedure.
#   cp .env.example .env   # set HJV_DOMAIN
#   docker compose build && docker compose up -d
#   cat data/id_ed25519.pub # the key clients are built with (HJV_SERVER_KEY)

# a fixed project name, so that no other project started from a "deploy" directory is mixed in
name: hjviewer

# container logs are capped here rather than in the global Docker daemon settings
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    # HJV_REGISTRY: base images come from the ECR mirror of Docker's official images by default,
    # since Docker Hub rate-limits anonymous pulls per address (shared university NAT, CI runners)
    image: ${HJV_REGISTRY:-public.ecr.aws/docker/library}/caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      HJV_DOMAIN: ${HJV_DOMAIN:?set HJV_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hbbs
      - hbbr
    logging: *logging
    restart: unless-stopped

  hbbs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        REGISTRY: ${HJV_REGISTRY:-public.ecr.aws/docker/library}
        # parallel compile jobs; each can take about 1 GB of memory
        BUILD_JOBS: ${HJV_BUILD_JOBS:-2}
    image: hjviewer-server:local
    # -r: the relay handed to peers; clients reach it as wss://<domain>/ws/relay
    command: ["hbbs", "-r", "${HJV_DOMAIN:?set HJV_DOMAIN in .env}"]
    volumes:
      - ./data:/data
    # hbbs and hbbr need no capabilities: unprivileged ports, files in their own root-owned /data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped

  hbbr:
    image: hjviewer-server:local
    # -k _: relay only for clients holding the server key (shared with hbbs through ./data)
    command: ["hbbr", "-k", "_"]
    environment:
      # relay caps in Mb/s, set in .env; empty keeps hbbr's defaults (1024 in all, 128 a session)
      TOTAL_BANDWIDTH: ${HJV_TOTAL_BANDWIDTH:-}
      SINGLE_BANDWIDTH: ${HJV_SINGLE_BANDWIDTH:-}
    volumes:
      - ./data:/data
    depends_on:
      - hbbs
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
