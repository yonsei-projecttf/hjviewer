# actionlint (scripts/ci.sh client). Its 1.7.12 does not know the job context's workflow_repository,
# workflow_sha and workflow_ref yet, which GitHub documents ("Contexts", job context) and
# store-release.yml checks out with and prints: those three messages only, in that file only.
paths:
  "**/.github/workflows/store-release.yml":
    ignore:
      - 'property "workflow_(repository|sha|ref)" is not defined in object type'
