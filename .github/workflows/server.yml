# Server CI: the checks of scripts/ci.sh, which normally runs on the development machine
# (docs/ci.md). GitHub CI is paused, so this workflow runs only when started by hand.
name: server

on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        # musl-tools and the musl target: the deploy stage builds hjv-relay's static packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Server tests and the deployment test
        run: scripts/ci.sh all
