# Server CI: the checks of scripts/ci.sh, which normally runs on the development machine
# (docs/ci.md). GitHub CI is paused, so this workflow runs only when started by hand.
name: server

on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Server tests and the deployment test
        run: scripts/ci.sh all
