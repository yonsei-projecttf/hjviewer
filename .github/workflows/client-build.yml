# Builds the hjviewer client (RustDesk 1.5.0 + client/patches) for Windows x64, Android arm64 and
# iOS. Every job checks out this repository (also when the private build repository calls this
# workflow), runs `scripts/fetch-upstream.sh client` and builds inside
# upstream/rustdesk with the steps of upstream's own CI at RUSTDESK_COMMIT. "upstream: Lx-y" comments
# point at upstream/rustdesk/.github/workflows/flutter-build.yml unless another file is named.
# With `play`, the play job sends the signed Android bundle to Google Play's internal testing track.
# Variables, signing secrets, run times and billing are documented in docs/ci.md.
name: client

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options: [windows, android, ios, all]
        default: all
      server:
        description: "Server domain for this run (default: repository variable HJV_SERVER)"
        type: string
        required: false
      server_key:
        description: "Server public key, data/id_ed25519.pub (default: repository variable HJV_SERVER_KEY)"
        type: string
        required: false
      testflight:
        description: "iOS: upload the signed App Store build to TestFlight (private repository, App Store Connect secrets)"
        type: boolean
        default: false
      play:
        description: "Android: upload the signed bundle to Google Play's internal testing track (private repository, Play secrets)"
        type: boolean
        default: false
      play_release:
        description: "Google Play: completed (testers get it), draft (roll out in Play Console) or validate (check only, release nothing)"
        type: choice
        options: [completed, draft, validate]
        default: completed
  # The private build repository (yonsei-projecttf/hjviewer-private, docs/ci.md) calls this workflow
  # with its secrets: real server values and signing keys. The code still comes from this repository.
  workflow_call:
    inputs:
      platforms:
        type: string
        default: all
      testflight:
        type: boolean
        default: false
      play:
        type: boolean
        default: false
      play_release:
        type: string
        default: completed
      source_ref:
        description: Branch, tag or commit of this repository to build
        type: string
        required: true
  # GitHub CI is paused (docs/ci.md): no build on tag pushes (`push: tags: ["v*"]`) for now, only
  # runs started by hand

run-name: client ${{ github.event_name == 'push' && github.ref_name || inputs.platforms }}

permissions:
  contents: read

env:
  # The repository the code is checked out from. Only workflow_call has source_ref; when it is called,
  # github.repository and github.sha name the caller, which holds no code.
  SOURCE_REPOSITORY: ${{ inputs.source_ref && 'yonsei-projecttf/hjviewer' || github.repository }}
  # Server identity, baked into the Rust core by client/patches (option_env!) in every cargo build.
  # Secrets are masked in the logs, variables are not; either works. The values still end up in the
  # built apps, which are downloadable by anyone while the repository is public.
  HJV_SERVER: ${{ inputs.server || secrets.HJV_SERVER || vars.HJV_SERVER }}
  HJV_SERVER_KEY: ${{ inputs.server_key || secrets.HJV_SERVER_KEY || vars.HJV_SERVER_KEY }}
  # Tool versions copied from upstream at RUSTDESK_COMMIT; bump them together with scripts/upstream.env.
  RUST_VERSION: "1.75" # L22; upstream's Windows job reads SCITER_RUST_VERSION (L21), same value; bridge.yml L11
  CARGO_NDK_VERSION: "3.1.2" # L24
  LLVM_VERSION: "15.0.6" # L27
  FLUTTER_VERSION: "3.24.5" # L28, Windows and iOS
  ANDROID_FLUTTER_VERSION: "3.24.5" # L29
  # Not in upstream (macos-latest, image default). App Store Connect takes builds from Xcode 26 or later;
  # with Xcode 27 (iOS 27 SDK) a Flutter 3.24.5 app, which has no UIScene life cycle, does not launch.
  XCODE_VERSION: "26.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d" # L39-45, vcpkg 2026.07.29 = vcpkg.json baseline
  NDK_VERSION: "r28c" # L49
  BRIDGE_FLUTTER_VERSION: "3.22.3" # bridge.yml L25, the default "bridge-artifact"
  CARGO_EXPAND_VERSION: "1.0.95" # bridge.yml L9
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1" # bridge.yml L10
  ARTIFACT_RETENTION_DAYS: 7

# vcpkg binary cache (deviation from upstream): upstream sets VCPKG_BINARY_SOURCES=clear;x-gha,readwrite
# (L38), but vcpkg removed the x-gha provider in 2025 (microsoft/vcpkg-tool#1662) and the pinned vcpkg
# only warns about it, so upstream rebuilds every port on every run. Each vcpkg job here uses a files
# provider instead, restored and saved with actions/cache, keeping only the packages the run installed.

jobs:
  # upstream: bridge.yml (generate_bridge, matrix entry L21-27), called from L85-86
  generate-bridge:
    name: Bridge codegen
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: upstream/rustdesk
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check server variables
        working-directory: ${{ github.workspace }}
        env:
          CALLED: ${{ inputs.source_ref }}
        run: |
          if [ -n "$HJV_SERVER" ] && [ -n "$HJV_SERVER_KEY" ]; then
            echo "Building for server $HJV_SERVER"
          elif [ -n "$CALLED" ]; then
            # the private build repository passes its secrets (secrets: inherit, same organization only)
            echo "::error::HJV_SERVER and HJV_SERVER_KEY did not arrive: set both as repository secrets of the build repository, which must call this workflow with secrets: inherit from the same organization. Without them the apps behave like stock RustDesk."
            exit 1
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::Set the repository variables HJV_SERVER and HJV_SERVER_KEY before tagging a release; without them the apps behave like stock RustDesk."
            exit 1
          else
            echo "::warning::Repository variables HJV_SERVER and HJV_SERVER_KEY are not both set; these builds behave like stock RustDesk."
          fi

      # play uploads what the android job builds; without it the play job would just be skipped
      - name: Check the Google Play input
        if: inputs.play && inputs.platforms != 'android' && inputs.platforms != 'all'
        working-directory: ${{ github.workspace }}
        run: |
          echo "::error::play uploads the Android build: run with platforms android or all."
          exit 1

      - name: Check out hjviewer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      # every platform job builds this commit, even if the branch moves during the run
      - name: Record the source commit
        id: source
        working-directory: ${{ github.workspace }}
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream and apply hjviewer patches
        working-directory: ${{ github.workspace }}
        run: bash scripts/fetch-upstream.sh client

      # bridge.yml L42-59
      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      # bridge.yml L61-70
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04
          workspaces: upstream/rustdesk -> target

      # bridge.yml L72-77 ("Cache Bridge") is dropped: nothing in the job writes /tmp/flutter_rust_bridge.

      # bridge.yml L79-84
      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      # bridge.yml L86-99, Flutter 3.22.3 branch
      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # Default Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      # bridge.yml L101-104
      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      # bridge.yml L106-116
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          if-no-files-found: error
          retention-days: 1
          path: |
            upstream/rustdesk/src/bridge_generated.rs
            upstream/rustdesk/src/bridge_generated.io.rs
            upstream/rustdesk/flutter/lib/generated_bridge.dart
            upstream/rustdesk/flutter/lib/generated_bridge.freezed.dart
            upstream/rustdesk/flutter/macos/Runner/bridge_generated.h
            upstream/rustdesk/flutter/ios/Runner/bridge_generated.h

  # Not upstream: the Dart tests of the client patches that need the generated bridge (the gesture
  # tests reach remote_input.dart through gestures.dart), and the pure ones. A job of its own, so a
  # failing test shows in the run without holding back the platform builds.
  dart-tests:
    name: Dart tests
    needs: generate-bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: upstream/rustdesk/flutter
    steps:
      - name: Check out hjviewer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.generate-bridge.outputs.source_sha }}
          persist-credentials: false

      - name: Fetch upstream and apply hjviewer patches
        working-directory: ${{ github.workspace }}
        run: bash scripts/fetch-upstream.sh client

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          if [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]]; then
            git apply "${{ github.workspace }}/upstream/rustdesk/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: upstream/rustdesk

      # The whole test folder: upstream's own tests guard the code around the input patches. The
      # tests those patches add or update must be there, so a dropped patch fails the job. The
      # gesture and quality monitor tests need the generated bridge.
      - name: Run the tests
        run: |
          for t in test/soft_keyboard_input_test.dart test/soft_keyboard_log_test.dart \
            test/mobile_gestures_test.dart test/common/widgets/gestures_test.dart \
            test/quality_monitor_transport_test.dart; do
            if [ ! -f "$t" ]; then echo "::error::$t is not in the patched tree"; exit 1; fi
          done
          flutter pub get
          flutter test

  # upstream: L109-461 (build-for-windows-flutter), x64 matrix entry L119-126. Dropped: the arm64
  # entry and its steps, upstream's private signing service (SIGN_BASE_URL), MSI and MSI template,
  # the release upload, and "find Runner.res" (no consumer of libs/portable/Runner.res at this commit).
  windows:
    name: Windows x64
    needs: generate-bridge
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'windows'
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        working-directory: upstream/rustdesk
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"
    steps:
      - name: Check out hjviewer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.generate-bridge.outputs.source_sha }}
          persist-credentials: false

      # The runner's Git checks text files out with CRLF (core.autocrlf=true). Upstream's sources get
      # that, as in upstream CI, but bash and `git am --keep-cr` need hjviewer's scripts and .patch
      # files byte-exact, so this repository alone is checked out again with LF endings.
      - name: Re-check out hjviewer with LF line endings
        working-directory: ${{ github.workspace }}
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git rm -q --cached -r .
          git reset -q --hard

      - name: Fetch upstream and apply hjviewer patches
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          bash scripts/fetch-upstream.sh client
          # Windows file versions have four 16-bit fields; the fourth is this workflow's run number,
          # which grows with every run (the caller's when the private build repository calls it).
          bash scripts/set-client-version.sh "$GITHUB_RUN_NUMBER"
          source client/version.env
          if [ "$GITHUB_REF_TYPE" = tag ]; then name=$GITHUB_REF_NAME; else name="$HJV_VERSION-$(git rev-parse --short=7 HEAD)"; fi
          echo "BUILD_NAME=HJViewer-$name" >> "$GITHUB_ENV"

      # L150-157
      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: upstream/rustdesk

      # L159-162
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      # L164-174
      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0; https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # L208-218, https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      # L220-230
      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$(dirname "$(dirname "$(which flutter)")")"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          if [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      # L240-249
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022
          workspaces: upstream/rustdesk -> target

      # L251-256
      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: vcpkg-bincache
          key: vcpkg-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-
          restore-keys: vcpkg-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-

      # L258-276
      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-bincache"
          if ! "$VCPKG_ROOT/vcpkg" \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true
        shell: bash

      - name: Prune and fingerprint vcpkg binary cache
        id: vcpkg-fp
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          abis=$(sed -n 's/^Abi: //p' "$VCPKG_ROOT/installed/vcpkg/status" | tr -d '\r' | sort -u)
          find vcpkg-bincache -name '*.zip' | while read -r zip; do
            grep -qxF "$(basename "$zip" .zip)" <<< "$abis" || rm -f "$zip"
          done
          echo "key=${{ steps.vcpkg-cache.outputs.cache-primary-key }}$(find vcpkg-bincache -name '*.zip' | sort | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Save vcpkg binary cache
        if: steps.vcpkg-fp.outputs.key != steps.vcpkg-cache.outputs.cache-matched-key
        uses: actions/cache/save@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: vcpkg-bincache
          key: ${{ steps.vcpkg-fp.outputs.key }}

      # L285-324, x64 build-args "--vram" (L125)
      - name: Build rustdesk
        run: |
          # Windows: build RustDesk
          # --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Not packaged: RustDesk's printer driver adapter DLL is closed source, so it cannot be part of
          # the AGPL Corresponding Source, and its driver is RustDesk-branded. Remote printing stays off
          # (src/server/printer_service.rs skips it when the DLL is missing).

      # Privacy-mode helper WindowInjection.dll. Upstream builds it in a separate job
      # (third-party-RustDeskTempTopMostWindow.yml L41-59, called from L88-107 with windows-2022, x64,
      # Release, Windows10) and downloads it into ./rustdesk (L342-347); built inline here.
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build RustDeskTempTopMostWindow
        run: |
          $src = "$env:RUNNER_TEMP\RustDeskTempTopMostWindow"
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow $src
          git -C $src checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild "$src\WindowInjection\WindowInjection.vcxproj" -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          Copy-Item "$src\WindowInjection\x64\Release\WindowInjection.dll" ./rustdesk/

      # L363-373
      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          # Not in upstream. The installer registers <app name>.exe for the service, the Startup tray
          # link, the Start menu and uninstall, but copies files under their own names, so the runner
          # must carry the app's name: HJViewer when HJV_SERVER is set (src/hjviewer.rs). A build
          # without it stays RustDesk, which matches rustdesk.exe on Windows' case-blind file system.
          exe=rustdesk.exe
          if [ -n "$HJV_SERVER" ]; then
            if ! grep -q 'const APP_NAME: &str = "HJViewer";' src/hjviewer.rs; then
              echo "::error::src/hjviewer.rs no longer names the app HJViewer; change the executable name here too."
              exit 1
            fi
            exe=HJViewer.exe
            mv ./rustdesk/rustdesk.exe "./rustdesk/$exe"
          fi
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/$exe"
          popd
          mkdir -p ./SignOutput
          # The file users download and run. Its name matters to the packer: a name ending in
          # "install.exe" installs at once and one with "-qs-" starts quick support (libs/portable).
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/HJViewer.exe
          cp ./SignOutput/HJViewer.exe ./SignOutput/HJViewer-install.exe

      - name: Add license, source and third-party notices
        shell: bash
        env:
          NOTICES_FEATURES: flutter,hwcodec,vram
          NOTICES_TARGET: x86_64-pc-windows-msvc
        run: |
          test -s SignOutput/HJViewer.exe
          test -s SignOutput/HJViewer-install.exe
          bash "$GITHUB_WORKSPACE/scripts/package-notices.sh" SignOutput . \
            rustdesk/usbmmidd_v2/License.txt "Amyuni USB Mobile Monitor virtual display driver (usbmmidd_v2)" \
            "$RUNNER_TEMP/RustDeskTempTopMostWindow/LICENSE" "RustDeskTempTopMostWindow (WindowInjection.dll)"

      - name: Upload Windows build (unsigned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BUILD_NAME }}-windows-x86_64
          path: |
            upstream/rustdesk/SignOutput/HJViewer.exe
            upstream/rustdesk/SignOutput/HJViewer-install.exe
            upstream/rustdesk/SignOutput/*.txt
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      # Not in upstream. Installs the build on the runner the way a user does and checks that it will
      # start with Windows: HJViewer.exe in Program Files, an automatic, running service and the
      # Startup tray link. The server's name is pointed at 127.0.0.1 first, so the runner never
      # registers a device on the real server. Advisory (continue-on-error) until it has passed on a
      # few builds; the step's own result shows in the run summary.
      - name: Install smoke test
        if: env.HJV_SERVER != ''
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          $hosts = "$env:SystemRoot\System32\drivers\etc\hosts"
          Add-Content -Path $hosts -Value "`n127.0.0.1 $env:HJV_SERVER"
          Clear-DnsClientCache
          # --silent-install is not awaited: the tray it starts keeps the process tree alive
          Start-Process -FilePath (Resolve-Path .\SignOutput\HJViewer.exe) -ArgumentList '--silent-install'
          $deadline = (Get-Date).AddMinutes(5)
          do {
            Start-Sleep -Seconds 5
            $svc = Get-CimInstance Win32_Service -Filter "Name='HJViewer'" -ErrorAction SilentlyContinue
          } until (($svc -and $svc.State -eq 'Running') -or (Get-Date) -gt $deadline)
          $exe = Join-Path $env:ProgramFiles 'HJViewer\HJViewer.exe'
          $lnk = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Startup\HJViewer Tray.lnk'
          $failed = @()
          if (-not (Test-Path $exe)) { $failed += "$exe is not installed" }
          if (-not $svc) {
            $failed += 'there is no HJViewer service'
          } else {
            Write-Host "service: $($svc.StartMode) $($svc.State) $($svc.PathName)"
            if ($svc.StartMode -ne 'Auto' -or $svc.State -ne 'Running') { $failed += 'the HJViewer service is not automatic and running' }
          }
          if (-not (Test-Path $lnk)) { $failed += 'the Startup tray link is missing' }
          Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager'; StartTime = (Get-Date).AddMinutes(-10) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'HJViewer' } | Select-Object -First 10 | Format-List TimeCreated, Id, Message
          foreach ($f in $failed) { Write-Host "::error::$f" }
          if ($failed) { exit 1 }
          Write-Host 'HJViewer is installed and will start with Windows.'

  # upstream: L1036-1327 (build-rustdesk-android), aarch64 matrix entry L1044-1050. Dropped: the
  # armv7/x86_64 entries, the universal APK job (L1329-1512), the librustdesk.so upload and the release
  # upload. Without a release keystore the APK keeps upstream's debug signature (L1238-1239).
  android:
    name: Android arm64
    needs: generate-bridge
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: upstream/rustdesk
    env:
      ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"
    outputs:
      # read by the play job; set by "Sign and check Play bundle"
      play_artifact: ${{ steps.play-bundle.outputs.artifact }}
      play_version_name: ${{ steps.play-bundle.outputs.version_name }}
      play_version_code: ${{ steps.play-bundle.outputs.version_code }}
    steps:
      # Like "Check TestFlight prerequisites": fail before an 18-minute build, not after it. The
      # Play secrets are checked in the play job: this job runs the build's third-party code
      # (Gradle, cargo, vcpkg, pub) as a sudo-capable user, so it must not reference them at all.
      - name: Check Google Play prerequisites
        if: inputs.play
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          PLAY_RELEASE: ${{ inputs.play_release }}
        run: |
          problems=()
          [ "$PRIVATE_REPOSITORY" = true ] || problems+=("play uploads only from the private build repository (docs/ci.md).")
          [ "$ANDROID_SIGNING" = true ] || problems+=("play needs the upload keystore: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS.")
          case $PLAY_RELEASE in
            completed|draft|validate) ;;
            *) problems+=("play_release must be completed, draft or validate.") ;;
          esac
          for p in "${problems[@]}"; do echo "::error::$p"; done
          [ ${#problems[@]} = 0 ]

      # Build number = UTC time as YYDDDHHMM: it grows with every build, from any repository (the
      # build repository too), stays below Play's 2,100,000,000 versionCode limit with Flutter's
      # 2000 arm64 offset, and is numeric as iOS requires. Stores refuse a build number twice.
      - name: Build number
        shell: bash
        working-directory: ${{ github.workspace }}
        run: echo "BUILD_NUMBER=$(date -u +%y%j%H%M)" >> "$GITHUB_ENV"

      # L1066-1075
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      # L1084-1116
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               wget

      - name: Check out hjviewer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.generate-bridge.outputs.source_sha }}
          persist-credentials: false

      - name: Fetch upstream and apply hjviewer patches
        working-directory: ${{ github.workspace }}
        run: |
          bash scripts/fetch-upstream.sh client
          bash scripts/set-client-version.sh
          source client/version.env
          if [ "$GITHUB_REF_TYPE" = tag ]; then name=$GITHUB_REF_NAME; else name="$HJV_VERSION-$(git rev-parse --short=7 HEAD)"; fi
          echo "BUILD_NAME=HJViewer-$name" >> "$GITHUB_ENV"

      # L1123-1134
      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          if [[ "3.24.5" == "${{ env.ANDROID_FLUTTER_VERSION }}" ]]; then
            git apply "${{ github.workspace }}/upstream/rustdesk/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          fi

      # L1136-1147
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: vcpkg-bincache
          key: vcpkg-arm64-android-${{ env.VCPKG_COMMIT_ID }}-
          restore-keys: vcpkg-arm64-android-${{ env.VCPKG_COMMIT_ID }}-

      # L1149-1175, arm64-v8a only
      - name: Install vcpkg dependencies
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-bincache"
          ANDROID_TARGET=arm64-v8a
          if ! ./flutter/build_android_deps.sh "${ANDROID_TARGET}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Prune and fingerprint vcpkg binary cache
        id: vcpkg-fp
        working-directory: ${{ github.workspace }}
        run: |
          abis=$(sed -n 's/^Abi: //p' "$VCPKG_ROOT/installed/vcpkg/status" | tr -d '\r' | sort -u)
          find vcpkg-bincache -name '*.zip' | while read -r zip; do
            grep -qxF "$(basename "$zip" .zip)" <<< "$abis" || rm -f "$zip"
          done
          echo "key=${{ steps.vcpkg-cache.outputs.cache-primary-key }}$(find vcpkg-bincache -name '*.zip' | sort | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Save vcpkg binary cache
        if: steps.vcpkg-fp.outputs.key != steps.vcpkg-cache.outputs.cache-matched-key
        uses: actions/cache/save@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: vcpkg-bincache
          key: ${{ steps.vcpkg-fp.outputs.key }}

      # L1177-1192
      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: upstream/rustdesk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android # TODO: drop '-android' part after caches are invalidated
          key: aarch64-linux-android
          workspaces: upstream/rustdesk -> target

      # L1194-1206
      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

      # L1230-1249 and L1278-1280
      - name: Build rustdesk
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          # Increase Gradle JVM memory for CI builds
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # temporary use debug sign config
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          # build flutter
          pushd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi --build-number "$BUILD_NUMBER"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../$BUILD_NAME-android-aarch64.apk"
          popd
          mkdir -p signed-apk
          mv "./$BUILD_NAME-android-aarch64.apk" signed-apk/

      # L1282-1302; https://github.com/r0adkll/sign-android-release/issues/84#issuecomment-1889636075
      - name: Setup sign tool version variable
        if: env.ANDROID_SIGNING == 'true'
        shell: bash
        run: |
          # shellcheck disable=SC2012 # upstream's line; build-tools dirs are plain version numbers
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> "$GITHUB_ENV"
          echo "Last build tool version is: $BUILD_TOOL_VERSION"

      - uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        name: Sign app APK
        if: env.ANDROID_SIGNING == 'true'
        id: sign-apk
        with:
          releaseDirectory: upstream/rustdesk/signed-apk
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # PKCS12 keystores (keytool's default) use the store password for the key too
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        env:
          # env.ANDROID_SIGN_TOOL_VERSION is set by Step "Setup sign tool version variable"
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}

      - name: Add license, source and third-party notices
        shell: bash
        env:
          NOTICES_FEATURES: flutter,hwcodec
          NOTICES_TARGET: aarch64-linux-android
        run: |
          ls signed-apk/*.apk > /dev/null
          bash "$GITHUB_WORKSPACE/scripts/package-notices.sh" signed-apk . \
            "$ANDROID_NDK_HOME/NOTICE" "?Android NDK, including libc++_shared.so" \
            "$ANDROID_NDK_HOME/NOTICE.toolchain" "?Android NDK toolchain"

      # L1304-1309
      - name: Upload signed APK
        if: env.ANDROID_SIGNING == 'true' && steps.sign-apk.outputs.signedReleaseFile != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BUILD_NAME }}-android-aarch64
          path: |
            ${{ steps.sign-apk.outputs.signedReleaseFile }}
            upstream/rustdesk/signed-apk/*.txt
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload debug-signed APK
        if: env.ANDROID_SIGNING != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BUILD_NAME }}-android-aarch64-debugsigned
          path: |
            upstream/rustdesk/signed-apk/${{ env.BUILD_NAME }}-android-aarch64.apk
            upstream/rustdesk/signed-apk/*.txt
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      # Not in upstream. Google Play takes an Android App Bundle signed with an upload key, which is
      # this job's release keystore. These steps run after the APK has been uploaded, so a bundle
      # failure never costs the APK. The APK build switched release signing to the debug key; the
      # bundle is built with no signing config and signed once below (jarsigner: apksigner cannot
      # sign bundles). Its versionCode is this run's arm64 APK's: `--split-per-abi` adds 2000 for
      # arm64 to the build number, a bundle gets the build number as given.
      - name: Build Play bundle
        if: env.ANDROID_SIGNING == 'true' && github.event.repository.private
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          gradle=flutter/android/app/build.gradle
          if [ "$(grep -c '^ *signingConfig signingConfigs\.debug$' "$gradle")" != 1 ]; then
            echo "::error::$gradle does not have the one debug signing line the APK build writes; update this step."
            exit 1
          fi
          sed -i '/^ *signingConfig signingConfigs\.debug$/d' "$gradle"
          version_code=$((10#$BUILD_NUMBER + 2000))
          echo "PLAY_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          pushd flutter
          flutter build appbundle --release --target-platform android-arm64 --build-number "$version_code"
          popd

      - name: Sign and check Play bundle
        if: env.ANDROID_SIGNING == 'true' && github.event.repository.private
        id: play-bundle
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNED_APK: ${{ steps.sign-apk.outputs.signedReleaseFile }}
          BUNDLETOOL_VERSION: "1.18.3" # 2025-12-15, the latest release on 2026-10-12
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
          # What Play's declarations look at (docs/ci.md, "Google Play 업로드"): permissions, foreground
          # service types (0x400000a0 = specialUse|mediaProjection|microphone) and accessibility
          # services. A change needs Play Console > App content checked before Play takes the bundle;
          # then update this list. CI uploads never show Play Console's declaration prompts.
          PLAY_MANIFEST: |
            accessibility-service com.carriez.flutter_hbb.InputService
            foreground-service-type 0x400000a0
            permission android.permission.ACCESS_NETWORK_STATE
            permission android.permission.CAMERA
            permission android.permission.FOREGROUND_SERVICE
            permission android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION
            permission android.permission.FOREGROUND_SERVICE_MICROPHONE
            permission android.permission.FOREGROUND_SERVICE_SPECIAL_USE
            permission android.permission.INTERNET
            permission android.permission.POST_NOTIFICATIONS
            permission android.permission.RECEIVE_BOOT_COMPLETED
            permission android.permission.RECORD_AUDIO
            permission android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS
            permission android.permission.SYSTEM_ALERT_WINDOW
            permission android.permission.WAKE_LOCK
            permission kr.ac.yonsei.hjviewer.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
        run: |
          set -euo pipefail
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          status=0
          fail() { echo "::error::$*"; status=1; }

          unsigned=flutter/build/app/outputs/bundle/release/app-release.aab
          mkdir -p play-bundle
          aab="play-bundle/$BUILD_NAME-android-aarch64.aab"
          work="$RUNNER_TEMP/play-check"
          rm -rf "$work" && mkdir -p "$work/lib"

          # Decoded outside the workspace; removed below and by the cleanup step
          ks="$RUNNER_TEMP/play-upload.keystore"
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ks")
          # PKCS12 keystores (keytool's default) use the store password for the key too
          export HJV_KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"

          # One signer only (grep without -q: with pipefail an early exit fails unzip with SIGPIPE)
          if unzip -Z1 "$unsigned" | grep -E '^META-INF/[^/]+\.(SF|RSA|DSA|EC)$' > /dev/null; then
            echo "::error::$unsigned is already signed; it must be built without a signing config."
            exit 1
          fi
          # Passwords from the environment (:env), never on the command line. jarsigner prints its
          # errors (a wrong password or alias) on stdout and never a password, so show them.
          if ! jarsigner -keystore "$ks" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env HJV_KEY_PASS \
            -sigalg SHA256withRSA -digestalg SHA-256 -signedjar "$aab" "$unsigned" "$ANDROID_KEY_ALIAS" > "$work/sign.txt" 2>&1; then
            cat "$work/sign.txt"
            echo "::error::jarsigner could not sign the bundle with the upload keystore; see its output above."
            exit 1
          fi

          bt_jar="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
          curl -fsSL --retry 3 -o "$bt_jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $bt_jar" | sha256sum -c --quiet -
          bt() { java -jar "$bt_jar" "$@"; }

          # 1. The JAR signature verifies (not -strict, which fails on any self-signed certificate),
          #    covers every entry, has one signer, and that signer is the upload key
          jarsigner -verify "$aab" > "$work/verify.txt" 2>&1 || { cat "$work/verify.txt"; fail "jarsigner cannot verify the bundle"; }
          grep -q '^jar verified\.' "$work/verify.txt" || fail "jarsigner did not report 'jar verified.'"
          if grep -q 'unsigned entries' "$work/verify.txt"; then fail "the bundle has unsigned entries"; fi
          keytool -printcert -jarfile "$aab" > "$work/certs.txt"
          signers=$(grep -c '^Signer #' "$work/certs.txt" || true)
          [ "$signers" = 1 ] || fail "the bundle has $signers signers; Play expects one, the upload key"
          got=$(awk '$1 == "SHA256:" { print $2; exit }' "$work/certs.txt" | tr -d ':' | tr 'A-F' 'a-f')
          want=$(keytool -exportcert -keystore "$ks" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" |
            sha256sum | cut -d' ' -f1)
          if [ -z "$got" ] || [ "$got" != "$want" ]; then fail "the bundle is not signed with the upload key"; fi
          rm -f "$ks"
          echo "upload certificate SHA-256: $got"

          # 2. Manifest: package, versionCode (this run's arm64 APK's), versionName, target SDK, and
          #    what Play's declarations look at (PLAY_MANIFEST above)
          bt validate --bundle="$aab" > "$work/validate.txt" || { cat "$work/validate.txt"; fail "bundletool validate failed"; }
          x() { bt dump manifest --bundle="$aab" --xpath="$1" 2> /dev/null | tr -d '\r\n'; }
          pkg=$(x /manifest/@package)
          vc=$(x /manifest/@android:versionCode)
          vn=$(x /manifest/@android:versionName)
          tsdk=$(x /manifest/uses-sdk/@android:targetSdkVersion)
          dbg=$(x /manifest/application/@android:debuggable)
          # shellcheck source=/dev/null
          source "$GITHUB_WORKSPACE/client/version.env"
          apk_vc=$("$ANDROID_HOME/build-tools/$ANDROID_SIGN_TOOL_VERSION/aapt2" dump badging "$GITHUB_WORKSPACE/$SIGNED_APK" |
            sed -n "s/^package: .* versionCode='\([0-9]*\)'.*/\1/p")
          echo "bundle: $pkg $vn ($vc), targetSdk $tsdk; arm64 APK of this run: $apk_vc"
          [ "$pkg" = kr.ac.yonsei.hjviewer ] || fail "package is $pkg"
          [ "$vc" = "$PLAY_VERSION_CODE" ] || fail "versionCode is $vc, expected $PLAY_VERSION_CODE"
          [ "$vc" = "$apk_vc" ] || fail "versionCode $vc differs from this run's APK ($apk_vc)"
          [ "$vc" -le 2100000000 ] 2> /dev/null || fail "versionCode $vc is above Play's limit 2100000000"
          [ "$vn" = "$HJV_VERSION" ] || fail "versionName is $vn, expected $HJV_VERSION"
          [ "${tsdk:-0}" -ge 36 ] 2> /dev/null || fail "targetSdk $tsdk is below 36, which Play requires from 2026-08-31"
          [ "$dbg" != true ] || fail "the bundle is debuggable"
          # one line per match, "<kind> <value>"; bundletool prints an empty line when nothing matches
          dump() { bt dump manifest --bundle="$aab" --xpath="$2" | sed '/^[[:space:]]*$/d' | sed "s/^/$1 /"; }
          {
            dump permission /manifest/uses-permission/@android:name
            dump permission /manifest/uses-permission-sdk-23/@android:name
            dump foreground-service-type /manifest/application/service/@android:foregroundServiceType
            dump accessibility-service \
              "/manifest/application/service[@android:permission='android.permission.BIND_ACCESSIBILITY_SERVICE']/@android:name"
          } | tr -d '\r' | sort > "$work/manifest.txt"
          sed '/^$/d' <<< "$PLAY_MANIFEST" | sort > "$work/manifest.expected"
          if ! diff "$work/manifest.expected" "$work/manifest.txt" > "$work/manifest.diff"; then
            cat "$work/manifest.diff"
            fail "the bundle's permissions, foreground service types or accessibility services changed (diff above, > = new): check Play Console > App content, then update PLAY_MANIFEST in this step"
          fi

          # 3. 16 KB pages: uncompressed native libraries need 16 KB zip alignment (AGP 8.5.1+ asks
          #    bundletool for it) and every LOAD segment 16 KB alignment or more. arm64-v8a only.
          bt dump config --bundle="$aab" > "$work/config.json"
          read -r uncompressed align < <(python3 -I -c '
          import json, sys
          u = json.load(open(sys.argv[1])).get("optimizations", {}).get("uncompressNativeLibraries", {})
          print(str(u.get("enabled", False)).lower(), u.get("alignment", "unset"))' "$work/config.json")
          echo "uncompressed native libraries: $uncompressed, zip page alignment: $align"
          if [ "$uncompressed" = true ] && [ "$align" != PAGE_ALIGNMENT_16K ]; then
            fail "native libraries are stored uncompressed without 16 KB zip alignment ($align)"
          fi
          abis=$(unzip -Z1 "$aab" | sed -n 's|^base/lib/\([^/]*\)/.*|\1|p' | sort -u | tr '\n' ' ')
          [ "$abis" = "arm64-v8a " ] || fail "native code for ABIs other than arm64-v8a: $abis"
          unzip -q -o "$aab" 'base/lib/arm64-v8a/*.so' -d "$work/lib"
          for so in "$work"/lib/base/lib/arm64-v8a/*.so; do
            small=""
            while read -r a; do
              if (( a < 16384 )); then small="$small $a"; fi
            done < <(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }')
            if [ -n "$small" ]; then fail "$(basename "$so") has LOAD segments aligned below 16 KB:$small"; fi
          done

          # 4. The R8 mapping, which Play takes from the bundle to deobfuscate crashes (a warning only)
          unzip -Z1 "$aab" | grep -x 'BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map' > /dev/null ||
            echo "::warning::The bundle has no R8 mapping; Play will show obfuscated stack traces."

          cp signed-apk/*.txt play-bundle/
          echo "Play bundle $(basename "$aab"): versionCode $vc, $(stat -c %s "$aab") bytes, upload certificate SHA-256 $got" >> "$GITHUB_STEP_SUMMARY"
          # for the play job: the artifact below and the version it carries
          { echo "artifact=$BUILD_NAME-android-aarch64-play"; echo "version_name=$vn"; echo "version_code=$vc"; } >> "$GITHUB_OUTPUT"
          exit $status

      - name: Upload Play bundle
        if: env.ANDROID_SIGNING == 'true' && github.event.repository.private
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BUILD_NAME }}-android-aarch64-play
          path: |
            upstream/rustdesk/play-bundle/*.aab
            upstream/rustdesk/play-bundle/*.txt
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Remove the upload keystore
        if: always() && env.ANDROID_SIGNING == 'true'
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/play-upload.keystore" upstream/rustdesk/signed-apk/signingKey.jks

  # Not in upstream. Sends the signed bundle to Google Play's internal testing track, the Android
  # counterpart of "Upload to TestFlight". A job of its own: the Play key never shares a runner with
  # the build's third-party code (Gradle, cargo, vcpkg), the upload waits for the Dart tests as
  # TestFlight does, and "Re-run failed jobs" retries only the upload, with the same bundle.
  # scripts/play-upload.py does the API calls; docs/ci.md lists the one-time Play Console setup.
  play:
    name: Google Play internal
    needs: [generate-bridge, dart-tests, android]
    if: inputs.play && github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # one Play edit at a time: committing an edit invalidates every other open edit of the app
    concurrency:
      group: google-play-${{ github.repository }}
      cancel-in-progress: false
    env:
      PLAY_PACKAGE: kr.ac.yonsei.hjviewer
    steps:
      - name: Check out hjviewer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.generate-bridge.outputs.source_sha }}
          persist-credentials: false

      # Checked here, not before the build (see the android job): a missing secret costs no
      # rebuild, because "Re-run failed jobs" runs only this job again with the same bundle.
      # GitHub drops a job output that contains a secret's value; an empty artifact name would
      # make the download below fetch every artifact of the run.
      - name: Check the Google Play secrets and the bundle
        env:
          PLAY_KEY_SET: ${{ secrets.PLAY_SA_EMAIL != '' && secrets.PLAY_SA_PRIVATE_KEY != '' }}
          ARTIFACT: ${{ needs.android.outputs.play_artifact }}
          VERSION_NAME: ${{ needs.android.outputs.play_version_name }}
          VERSION_CODE: ${{ needs.android.outputs.play_version_code }}
        run: |
          if [ "$PLAY_KEY_SET" != true ]; then
            echo "::error::Set the secrets PLAY_SA_EMAIL and PLAY_SA_PRIVATE_KEY (docs/ci.md), then use Re-run failed jobs: the bundle is kept."
            exit 1
          fi
          if [ -z "$ARTIFACT" ] || [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::The android job passed no bundle name or version (GitHub drops a job output that contains a secret's value)."
            exit 1
          fi

      - name: Download the signed bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.android.outputs.play_artifact }}
          path: play-bundle

      # The service account key reaches the script only through the environment; the script signs
      # its token request with openssl through a pipe and prints neither the key nor the token.
      - name: Upload to Google Play
        env:
          PLAY_SA_EMAIL: ${{ secrets.PLAY_SA_EMAIL }}
          PLAY_SA_PRIVATE_KEY: ${{ secrets.PLAY_SA_PRIVATE_KEY }}
          PLAY_RELEASE: ${{ inputs.play_release }}
          VERSION_NAME: ${{ needs.android.outputs.play_version_name }}
          VERSION_CODE: ${{ needs.android.outputs.play_version_code }}
          SOURCE_SHA: ${{ needs.generate-bridge.outputs.source_sha }}
        run: |
          set -euo pipefail
          aab=$(find play-bundle -name '*.aab' -print -quit)
          if [ -z "$aab" ]; then echo "::error::The android job left no bundle."; exit 1; fi
          # AGPL: testers see where this build's source is (Play builds carry no notice files)
          notes="$RUNNER_TEMP/play-notes.txt"
          printf 'HJViewer %s (%s)\n소스 코드(AGPL-3.0): https://github.com/%s/tree/%s\n' \
            "$VERSION_NAME" "$VERSION_CODE" "$SOURCE_REPOSITORY" "$SOURCE_SHA" > "$notes"
          mode=commit status=$PLAY_RELEASE
          if [ "$PLAY_RELEASE" = validate ]; then mode=validate status=completed; fi
          python3 -I scripts/play-upload.py --package "$PLAY_PACKAGE" --aab "$aab" --track internal \
            --status "$status" --mode "$mode" --name "$VERSION_NAME ($VERSION_CODE)" \
            --version-code "$VERSION_CODE" --notes-file "$notes" --notes-language ko-KR

  # upstream: L624-743 (build-rustdesk-ios), matrix entry L633-638. Dropped: the liblibrustdesk.a
  # upload (L715-719). Upstream only builds `flutter build ipa --release --no-codesign` (L721-727);
  # with the signing secrets this job archives with manual signing and exports an IPA instead, and
  # with the `testflight` input it uploads that IPA to App Store Connect.
  ios:
    name: iOS
    # also waits for the Dart tests: TestFlight hands the build out, so it never gets one whose
    # input tests failed (Windows and Android artifacts stay in the run until someone takes them)
    needs: [generate-bridge, dart-tests]
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'ios'
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: upstream/rustdesk
    env:
      # Signed only in a private repository (the build repository): a signed IPA's provisioning profile
      # names the Apple developer, the team and, for Ad Hoc, the device UDIDs, and the artifacts of a
      # public repository are public. A public run builds the unsigned IPA.
      IOS_SIGNING: ${{ github.event.repository.private && secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && 'true' || 'false' }}
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"
    steps:
      # Build number = UTC time as YYDDDHHMM: it grows with every build, from any repository (the
      # build repository too), stays below Play's 2,100,000,000 versionCode limit with Flutter's
      # 2000 arm64 offset, and is numeric as iOS requires. Stores refuse a build number twice.
      - name: Build number
        shell: bash
        working-directory: ${{ github.workspace }}
        run: echo "BUILD_NUMBER=$(date -u +%y%j%H%M)" >> "$GITHUB_ENV"

      - name: Check TestFlight prerequisites
        if: inputs.testflight && env.IOS_SIGNING != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          echo "::error::testflight needs a private repository with IOS_DIST_CERT_P12_BASE64 and IOS_PROVISIONING_PROFILE_BASE64 (the caller passes secrets: inherit)."
          exit 1

      # Not in upstream: XCODE_VERSION above says why
      - name: Select Xcode
        working-directory: ${{ github.workspace }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          xcodebuild -version
          case $(xcodebuild -version | head -n 1) in
            "Xcode 26."*) ;;
            *) echo "::error::Expected Xcode 26.x; see XCODE_VERSION."; exit 1 ;;
          esac

      # L647-653
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          brew install nasm yasm

      - name: Check out hjviewer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.generate-bridge.outputs.source_sha }}
          persist-credentials: false

      - name: Fetch upstream and apply hjviewer patches
        working-directory: ${{ github.workspace }}
        run: |
          bash scripts/fetch-upstream.sh client
          bash scripts/set-client-version.sh
          source client/version.env
          if [ "$GITHUB_REF_TYPE" = tag ]; then name=$GITHUB_REF_NAME; else name="$HJV_VERSION-$(git rev-parse --short=7 HEAD)"; fi
          echo "BUILD_NAME=HJViewer-$name" >> "$GITHUB_ENV"

      # L655-666
      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          if [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]]; then
            git apply "${{ github.workspace }}/upstream/rustdesk/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          fi

      # L668-672
      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: vcpkg-bincache
          key: vcpkg-arm64-ios-${{ env.VCPKG_COMMIT_ID }}-
          restore-keys: vcpkg-arm64-ios-${{ env.VCPKG_COMMIT_ID }}-

      # L674-690
      - name: Install vcpkg dependencies
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-bincache"
          if ! "$VCPKG_ROOT/vcpkg" \
            install \
            --triplet arm64-ios \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-arm64-ios-rel-out.log" || true
        shell: bash

      - name: Prune and fingerprint vcpkg binary cache
        id: vcpkg-fp
        working-directory: ${{ github.workspace }}
        run: |
          abis=$(sed -n 's/^Abi: //p' "$VCPKG_ROOT/installed/vcpkg/status" | tr -d '\r' | sort -u)
          find vcpkg-bincache -name '*.zip' | while read -r zip; do
            grep -qxF "$(basename "$zip" .zip)" <<< "$abis" || rm -f "$zip"
          done
          echo "key=${{ steps.vcpkg-cache.outputs.cache-primary-key }}$(find vcpkg-bincache -name '*.zip' | sort | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Save vcpkg binary cache
        if: steps.vcpkg-fp.outputs.key != steps.vcpkg-cache.outputs.cache-matched-key
        uses: actions/cache/save@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: vcpkg-bincache
          key: ${{ steps.vcpkg-fp.outputs.key }}

      # L692-713
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-ios
          key: aarch64-apple-ios
          workspaces: upstream/rustdesk -> target

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: upstream/rustdesk

      - name: Build rustdesk lib
        run: |
          rustup target add aarch64-apple-ios
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      # L721-727. --no-codesign stops at the .xcarchive; an IPA is Payload/<app>.app zipped.
      - name: Build rustdesk (unsigned)
        if: env.IOS_SIGNING != 'true'
        shell: bash
        run: |
          pushd flutter
          flutter build ipa --release --no-codesign --build-number "$BUILD_NUMBER"
          popd
          mkdir -p ios-out/Payload
          cp -R flutter/build/ios/archive/Runner.xcarchive/Products/Applications/*.app ios-out/Payload/
          cd ios-out && zip -qry "$BUILD_NAME-ios-unsigned.ipa" Payload && rm -rf Payload

      # Not in upstream. Installs the distribution identity in a temporary keychain, switches the Runner
      # target to manual signing with the given profile (bundle ID and export method follow the profile)
      # and writes ExportOptions.plist for `flutter build ipa`.
      - name: Set up code signing
        if: env.IOS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/hjviewer-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/dist.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -m1 ') ' || true)
          if [ -z "$identity" ]; then
            echo "::error::IOS_DIST_CERT_P12_BASE64 holds no valid signing identity: export the Apple Distribution certificate together with its private key."
            exit 1
          fi
          cert_sha1=$(awk '{print $2}' <<< "$identity")
          cert_name=$(cut -d'"' -f2 <<< "$identity")
          # "Apple Distribution: <name> (<team>)" names the developer: mask it in every later log line
          echo "::add-mask::$cert_name"
          signer=${cert_name#*: }
          echo "::add-mask::${signer% (*}"

          profile="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$profile"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$profile" 2> /dev/null; }
          profile_uuid=$(pb UUID)
          echo "IOS_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$profile_uuid.mobileprovision"
          done
          profile_team=$(pb TeamIdentifier:0)
          team_name=$(pb TeamName || true)
          for v in "$profile_team" "$team_name"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done
          team_id=${TEAM_ID:-$profile_team}
          if [ "$team_id" != "$profile_team" ]; then
            echo "::error::IOS_TEAM_ID ($team_id) is not the provisioning profile's team ($profile_team)."
            exit 1
          fi
          app_id=$(pb Entitlements:application-identifier)
          bundle_id=${app_id#*.}
          case $bundle_id in
            *'*'*) echo "::error::The provisioning profile is for the wildcard App ID $app_id; create one for an explicit bundle ID such as kr.ac.yonsei.hjviewer."; exit 1 ;;
          esac
          if [ "$(pb ProvisionsAllDevices || true)" = true ]; then method=enterprise
          elif [ "$(pb Entitlements:get-task-allow || true)" = true ]; then method=development
          elif pb ProvisionedDevices > /dev/null; then method=ad-hoc
          else method=app-store
          fi
          # Xcode 15.3 renamed the export methods and deprecated the old names
          if [ "$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')" -ge 16 ]; then
            case $method in
              app-store) method=app-store-connect ;;
              ad-hoc) method=release-testing ;;
              development) method=debugging ;;
            esac
          fi
          echo "Signing $bundle_id with profile $profile_uuid; export method $method"
          echo "IOS_EXPORT_METHOD=$method" >> "$GITHUB_ENV"

          # Manual signing on the Runner target only: its three build configurations are the ones that
          # name Runner.entitlements. Settings passed to xcodebuild would also hit the Pods targets.
          pbx=flutter/ios/Runner.xcodeproj/project.pbxproj
          if [ "$(grep -c 'CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;' "$pbx")" != 3 ]; then
            echo "::error::Unexpected Runner target layout in $pbx; update the signing step."
            exit 1
          fi
          TEAM="$team_id" BUNDLE="$bundle_id" IDENTITY="${cert_name%%:*}" PROFILE="$profile_uuid" perl -pi -e '
            s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $ENV{TEAM};/;
            s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $ENV{BUNDLE};/;
            s/^(\s*)CODE_SIGN_ENTITLEMENTS = Runner\/Runner\.entitlements;$/$&\n${1}CODE_SIGN_STYLE = Manual;\n${1}CODE_SIGN_IDENTITY = "$ENV{IDENTITY}";\n${1}"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "$ENV{IDENTITY}";\n${1}PROVISIONING_PROFILE_SPECIFIER = "$ENV{PROFILE}";/;
          ' "$pbx"

          # Runner.entitlements asks for push and Wi-Fi info, which the app does not use. Keep each only
          # if the profile grants it (signing fails otherwise) and take aps-environment from the profile.
          ent=flutter/ios/Runner/Runner.entitlements
          for key in aps-environment com.apple.developer.networking.wifi-info; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$ent" > /dev/null 2>&1 || continue
            if value=$(pb "Entitlements:$key"); then
              if [ "$key" = aps-environment ]; then
                /usr/libexec/PlistBuddy -c "Set :$key $value" "$ent"
              fi
            else
              echo "::warning::The provisioning profile does not grant $key, so it is removed from Runner.entitlements. Enable that capability on the App ID to keep it."
              /usr/libexec/PlistBuddy -c "Delete :$key" "$ent"
            fi
          done

          plist="$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$plist"
          for entry in "method string $method" "teamID string $team_id" "signingStyle string manual" \
            "signingCertificate string $cert_sha1" "provisioningProfiles dict" \
            "provisioningProfiles:$bundle_id string $profile_uuid"; do
            /usr/libexec/PlistBuddy -c "Add :$entry" "$plist" > /dev/null
          done
          plutil -lint "$plist"
          echo "IOS_EXPORT_OPTIONS=$plist" >> "$GITHUB_ENV"

      - name: Build rustdesk (signed IPA)
        if: env.IOS_SIGNING == 'true'
        shell: bash
        run: |
          pushd flutter
          flutter build ipa --release --export-options-plist="$IOS_EXPORT_OPTIONS" --build-number "$BUILD_NUMBER"
          popd
          mkdir -p ios-out
          mv flutter/build/ios/ipa/*.ipa "ios-out/$BUILD_NAME-ios.ipa"

      - name: Add license, source and third-party notices
        shell: bash
        env:
          NOTICES_FEATURES: flutter,hwcodec
          NOTICES_TARGET: aarch64-apple-ios
        run: |
          ls ios-out/*.ipa > /dev/null
          bash "$GITHUB_WORKSPACE/scripts/package-notices.sh" ios-out .

      - name: Upload IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BUILD_NAME }}-ios${{ env.IOS_SIGNING != 'true' && '-unsigned' || '' }}
          path: |
            upstream/rustdesk/ios-out/*.ipa
            upstream/rustdesk/ios-out/*.txt
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      # Not in upstream. Sends the signed App Store IPA to App Store Connect, where TestFlight lists it
      # once Apple has processed it. Needs the App Store Connect API key (secrets ASC_KEY_ID,
      # ASC_ISSUER_ID, ASC_PRIVATE_KEY) and the app's numeric Apple ID (ASC_APP_ID), see docs/ci.md.
      # altool can exit 0 although the upload failed, so its output decides.
      - name: Upload to TestFlight
        if: env.IOS_SIGNING == 'true' && inputs.testflight
        shell: bash
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ "$IOS_EXPORT_METHOD" != app-store-connect ]; then
            echo "::error::TestFlight takes App Store builds, but the provisioning profile exports with method $IOS_EXPORT_METHOD."
            exit 1
          fi
          for v in ASC_APP_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set (docs/ci.md)."
              exit 1
            fi
          done
          ipa="ios-out/$BUILD_NAME-ios.ipa"
          info="$RUNNER_TEMP/Info.plist"
          unzip -p "$ipa" "$(unzip -Z1 "$ipa" | grep -E '^Payload/[^/]+\.app/Info\.plist$')" > "$info"
          pl() { /usr/libexec/PlistBuddy -c "Print :$1" "$info"; }
          bundle_id=$(pl CFBundleIdentifier)
          version=$(pl CFBundleShortVersionString)
          build=$(pl CFBundleVersion)
          # altool reads the key from ~/.appstoreconnect/private_keys/AuthKey_<key ID>.p8
          keydir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keydir"
          (umask 077 && printf '%s\n' "$ASC_PRIVATE_KEY" > "$keydir/AuthKey_$ASC_KEY_ID.p8")
          out="$RUNNER_TEMP/altool.out"
          status=0
          xcrun altool --upload-package "$ipa" --type ios --apple-id "$ASC_APP_ID" --bundle-id "$bundle_id" \
            --bundle-short-version-string "$version" --bundle-version "$build" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format json > "$out" 2>&1 || status=$?
          cat "$out"
          if [ "$status" != 0 ] || grep -q '"product-errors"' "$out" \
            || ! grep -Eq '"success-message"|UPLOAD SUCCEEDED|No errors uploading' "$out"; then
            echo "::error::The upload to App Store Connect failed (altool exit status $status); see its output above."
            exit 1
          fi
          echo "Uploaded $bundle_id $version ($build) to App Store Connect. TestFlight lists it once Apple has processed it." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing keychain, profile and API key
        if: always() && env.IOS_SIGNING == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf "$HOME/.appstoreconnect/private_keys"
          security delete-keychain "$RUNNER_TEMP/hjviewer-signing.keychain-db" || true
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
