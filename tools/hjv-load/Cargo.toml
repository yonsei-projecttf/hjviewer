[package]
name = "hjv-load"
version = "0.1.0"
edition = "2021"
description = "Synthetic load for an hjviewer server: registered peers with heartbeats, and relayed sessions at a given bitrate"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
native-tls = "0.2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

[workspace]
